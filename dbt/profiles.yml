market_dw:
  target: dev
  outputs:
    # Local development and CI: free, runs on a laptop or a GitHub runner.
    dev:
      type: duckdb
      path: "{{ env_var('MDW_WAREHOUSE', 'data/warehouse.duckdb') }}"
      schema: main
      threads: 4

