name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MDW_DATA_DIR: ${{ github.workspace }}/data
      MDW_WAREHOUSE: ${{ github.workspace }}/data/warehouse.duckdb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (ingestion)
        run: pytest -q

      - name: Ingest synthetic data into Bronze and DuckDB
        run: python -m ingestion.run --sample

      - name: Install dbt packages
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Check source freshness
        run: dbt source freshness --project-dir dbt --profiles-dir dbt --target dev

      - name: dbt build (seeds, snapshot, models, unit tests, data tests)
        run: dbt build --project-dir dbt --profiles-dir dbt --target dev

      - name: Re-run dbt build (checks the incremental path)
        run: dbt build --project-dir dbt --profiles-dir dbt --target dev --select fact_daily_prices+

      - name: Dashboard smoke test (renders against the built warehouse)
        run: pytest -q tests/test_dashboard.py

      - name: Generate dbt docs
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --target dev

      - name: Upload dbt docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target
